name: Delivery validation
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements-ci.txt
      - run: npm ci --prefix frontend
      - run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Baseline and candidate replay
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python ops/validate.py --base "$BASE_SHA" --reports "$RUNNER_TEMP/validation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-evidence
          path: ${{ runner.temp }}/validation
          include-hidden-files: true
