# Development audit surface only. API/jobs remain stopped pending F01/F02.
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DEMO_MODE: "1"
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SSE_URL: /sse
    image: brandcompass-audit:20260912
    container_name: brandcompass-dev-web
    environment:
      NEXT_PUBLIC_DEMO_MODE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    # Caddy resolves host.docker.internal to this Docker host gateway on Ora.
    # No listener on the public interface; Basic Auth stays at the existing proxy.
    ports:
      - "172.17.0.1:4300:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/wip').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
