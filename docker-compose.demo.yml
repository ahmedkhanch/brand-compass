# Brand Compass — hybrid demo/real stack.
# Without any keys (DEMO_MODE=true) the full pipeline runs with brand-seeded mocks.
# Add real API keys to .env and set DEMO_MODE=false: each provider auto-switches
# independently — Firecrawl becomes real as soon as FIRECRAWL_API_KEY is present,
# DeepSeek as soon as DEEPSEEK_API_KEY is present, etc. Providers without keys keep
# serving mock data (graceful degradation, never crash).
#
# Frontend is published on host port 4300 (the port the create-ora-studio-project
# skill assigned to brandcompass-develop.oratelecom.net via Caddy).

services:
  backend:
    image: python:3.11-slim
    container_name: brandcompass-dev-api
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:///./data/brand_compass.db
      # API keys — when set on the host, docker-compose passes them through.
      # Unset vars are omitted by docker-compose (container sees empty/unset).
      - FIRECRAWL_API_KEY
      - DEEPSEEK_API_KEY
      - SERPAPI_KEY
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - PERPLEXITY_API_KEY
      - APIFY_TOKEN
    command: >
      bash -lc "pip install -q fastapi 'uvicorn[standard]' sqlalchemy aiosqlite
      pydantic-settings pyyaml jinja2 requests python-dotenv openai anthropic pyjwt stripe
      && mkdir -p /app/data
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:4399:8000"   # local debug only, not routed by Caddy
    restart: unless-stopped
    networks:
      - bcnet

  frontend:
    image: node:22-alpine
    container_name: brandcompass-dev-web
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_DEMO_MODE=1
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_SSE_URL=/sse
      - BACKEND_ORIGIN=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
    command: sh -lc "npm install --legacy-peer-deps && npm run dev -- -p 3000 -H 0.0.0.0"
    ports:
      - "4300:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bcnet

networks:
  bcnet:
    name: brandcompass_dev_net
